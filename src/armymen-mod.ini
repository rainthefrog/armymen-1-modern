; Army Men mod settings. Put this file next to ddraw.dll in the game folder.

[display]
; 1 = "Mod Settings" in the game's own pause menu and main menu (also F10; Shift + F10 = the old overlay panel)
mod_menu=1
; Fullscreen (F11 / Alt+Enter / maximise, or starting in it) uses the whole screen at the same
; scale as the window: the HUD keeps its size and you see more battlefield (also when switching
; while playing). 0 = fullscreen enlarges the window picture instead.
fullscreen_extends_view=1
; Battlefield zoom: soldiers, vehicles and the map drawn bigger, the HUD stays the same size.
; 1.0 = off; 1.25, 1.5, 1.75, 2, 2.5, 3. In game: Ctrl + mouse wheel, Ctrl + PageUp / PageDown, F10 panel.
zoom=1.0
; Darkness over the edge of the map (outside the area the game means to show; map makers parked
; objects there). Matters on wide screens.
map_edge_fog=1
; CRT filter: scanlines and a soft blend of the pixels. F9 or Gameplay > CRT filter switch it.
crt=0
; Sarge shows through buildings, walls and other tall objects drawn over him.
see_through=1
; 1 = radio messages (briefing, mission won / failed, Sarge dead) shown over the battlefield: a text-free radio
; and the message redrawn sharp at window resolution (same lines, same size). 0 = the game's own pictures.
radio_overlay=1
; 1 = open in a window, 0 = fullscreen. The game's -w / -f switches still override this.
windowed=1
; Window / screen size. Standard sizes:
;   720p (1280x720)   900p (1600x900)    1080p (1920x1080)  1200p (1920x1200)
;   1440p or 2k (2560x1440)   1600p (2560x1600)   2160p or 4k (3840x2160)   dci4k (4096x2160)
;   desktop = your screen size, custom = use width/height/scale below
; Each preset keeps about the same amount of battlefield as 1080p (540 rows; 1440p: 720) and takes
; the shape of your screen, so fullscreen has no black bars (e.g. 1080p on a 16:9 screen = 960x540
; game pixels x2, on a 4096x2160 screen = 1024x540 x2). The window can be resized by dragging.
resolution=1080p
; custom only: size of the game picture in game pixels (640x480 = original) and the whole-number
; enlargement (window = width x scale by height x scale). 0 = fill the screen.
width=1024
height=540
scale=2
; 1 = wait for the monitor refresh (no tearing). The game runs at the refresh of the monitor the window is on
; (60, 120, 144 Hz ...); the game clock follows it, so game speed is the same at any rate.
vsync=1
; Only with vsync=0: frames per second (e.g. 120 to try a 120 Hz feel on a 60 Hz monitor, with tearing);
; 0 = uncapped (the game clock then runs on real time)
fps_limit=0
; 1 = the game behaves the same at 120 / 144 Hz as at 60 (grenade gravity, animation timing)
framerate_fix=1
; 1 = videos fill the window (same shape, smooth), 0 = videos at a whole-number size
video_fit=1
; 1 = start in borderless fullscreen (the maximise button, Alt+Enter or F11 switch it; remembered)
borderless_fullscreen=0

[mouse]
; 1 = use the fixed cursor code (correct screen edges at any size, smooth speed)
fix=1
; 1 = the game cursor is the Windows pointer: exactly 1:1 with your mouse and free to leave the
;     window. 0 = the game's own cursor moved by raw mouse counts (locked to the window).
follow_windows_pointer=1
; (raw mode only) cursor speed multiplier and Windows pointer speed
sensitivity=1.0
use_windows_speed=1

[clock]
; Game speed. 1.0 = normal, 0.5 = half speed, 2.0 = double. Sound and videos are not affected.
speed=1.0
; 1 = in-game keys: Ctrl+'-' slower, Ctrl+'=' faster, Ctrl+'0' reset, Pause = pause/resume
hotkeys=1

[controls]
; modern  = mouse aims, left button fires (hold = auto-fire), shots go to the pointer,
;           hold right button walks toward the pointer, tap right button walks to that spot,
;           double-click right and hold = run (SPRINT shows on the HUD), mouse wheel =
;           change weapon (right click no longer does), W A S D walk in screen directions
;           (A, S and D are then no longer Attack Now / Air Strike / Defend)
; classic = the original keyboard controls only
; Switch while playing: Gameplay menu > Modern controls (windowed).
mode=modern
; The mouse (Army Men II style, one button): click the ground = walk there along a route, double-click =
;   sprint there, hold = walk toward the pointer; left on an enemy in range = shoot; left on your empty vehicle
;   = get in (click it again while driving = get out); click Sarge = stand / kneel / prone; right button or
;   Shift + left = shoot anywhere; right click your soldier = select his unit; keys 1-6 = weapon boxes;
;   middle click = next weapon, hold middle = radial menu. (The old left-fire / right-walk scheme is gone.)
; running speed compared to walking (1.6 = 60 % faster)
run_speed=1.6
; modern camera: follows Sarge smoothly instead of jumping ahead in the direction he faces.
; camera_lead = how far it looks toward the pointer (0 = always centred on Sarge, 0.15 = a little)
; camera_smooth_ms = easing time (higher = softer, 0 = no easing)
camera_lead=0.15
camera_smooth_ms=120
; modern controls: carry six weapons - every slot (main, heavy, special) gets a spare; the mouse
; wheel steps through all of them, a yellow mark on the HUD shows a slot with a spare
six_weapons=1
; a right click shorter than this (milliseconds) is a "walk to spot"
tap_ms=250
; while the left button is held Sarge fires as fast as the weapon allows (like rapid clicking);
; this adds an extra pause in milliseconds between shots (0 = none)
fire_interval_ms=0
; 1 = while playing in a window, keep the pointer inside it (released for menus and Alt-Tab). Default 0: free
keep_pointer_in_window=0
; Vehicles (2026-11-20). vehicle_reverse: a click to drive plans a route with the vehicle's own size at every heading,
;   backing up and turning (multi-point turn) where it must line up with a gap. 0 = the forward-only route.
; turret_smooth: the turret keeps pointing at the pointer while the hull turns (the game turned it with the hull and
;   the mouse aim pulled it back: jitter) and eases toward it. 0 = the old turret.
; vehicle_unstick: a vehicle wedged against an object may move out (any move that does not push it deeper), and
;   it no longer creeps into sandbags / rocks / walls a tile at a time; routes keep clear of such objects.
vehicle_reverse=1
turret_smooth=1
vehicle_unstick=1
; sarge_unstick: Sarge is moved out (a few px, never through it) when he stands inside a barricade's outline or
;   walking input does not move him although the way ahead is free (2026-11-20).
sarge_unstick=1
; mine_click: with mines selected a ring round Sarge shows where a mine can go; a left click inside it lays the mine
;   on that spot (the game's own laying, ammo and sound), a click outside it walks (2026-11-21). 0 = the original.
mine_click=1
; sweeper_click: while Sarge carries the minesweeper (any box) it detects mines within 96 px round him (rings on
;   mines, a lamp + count on its HUD box, pulses from the plate and beeps faster the nearer while it is selected);
;   a left click on a mine walks there and disarms it - the mine is COLLECTED into Sarge's mines (destroyed as
;   the original when his mine weapon is full). 0 = the original sweeper only (hold fire with it selected).
sweeper_click=1

[hud]
; Message box (bottom left) and minimap (bottom right) in the screen corners; the message box enlarged x corner_scale
; (1 to 3 in steps of 0.25; smaller when it does not fit); weapons and health stay centred.
; corners=0: the original centred panel.
corners=1
corner_scale=1.5
; The minimap (map + grid labels) alone: 1.5 / 2 / 2.5 - click the minimap's top-left corner to cycle (animated).
; The knob strip right of it stays 1.5x, air support stays beside it. If it does not fit, the message box shrinks first.
minimap_scale=2
; The middle part (logo, weapons, health, squad) and air support: 1.5 / 2 / 2.5 (resize icon on each group).
centre_scale=1.5
air_scale=1.5
; The mission objective stays pinned at the top left (and no longer fills the message box).
pin_objective=1
; The objective's target sector(s) blink on the minimap.
target_sector=1
; Mission path on the ground: a route from Sarge's start through the mission's targets in order (targets close
; together count as one point at their centre). Only the current part is shown (to the next target); when that part
; of the mission is done (target killed / picked up, pad or point reached), the next part shows.
mission_path=1
; Each part of the route varies a little (at most ~18 % longer than the shortest). The same route on Play Again; a
; new one when the mission is entered from the menus. 0 = always the shortest route.
mission_path_variation=1
; 1 = all parts of the route at once (the old display).
mission_path_all=0
; Minimap (also in Mod Settings, page MINIMAP): bigger blips with a dark outline in bright army colours
; (square = squad, diamond = vehicle, yellow-edged square = object / mission item), steady instead of blinking.
minimap_blips=1
; Sarge's blip bigger with a blinking white / yellow frame.
minimap_sarge=1
; The map picture darker and with more contrast, so the blips stand out.
minimap_contrast=1
; Pointer over a blip: a tooltip with army, kind, men left, health and distance from Sarge.
minimap_hover=1

[gameplay]
; The game stands still for 100 ms when play starts (about a second into a mission) and each time a menu
; or the pause closes - its own wait, the original does the same. 100 = as the original, 0 = no wait.
resume_wait_ms=100
; Your rifle fire flies over fences, walls and gates (they still block walking), and buildings
; only stop it where they stand - not on the roof drawn above their base.
shoot_over=1
; How height (ground elevation and stance) decides direct-fire hits (rifles, machine guns, cannon, bazooka;
; grenades, mortar and flamer are never changed). Mod Settings COMBAT "Height rules", F10 panel "Height rules".
;   modern   = (default; older name "stance") heights ignored, stance + cover decide: a shot hits the first unit it crosses, cliffs
;              and ridges never stop it (it still ends at its normal range), buildings / trees / tall rocks
;              block it. Bullets do 100 / 75 / 50 % to standing / kneeling / prone, blasts 75 % to prone; prone
;              behind low cover = cannot be hit (nor fire over it), kneeling there stops every second round;
;              prone soldiers are noticed at 60 % of the usual distance; bullets from behind do double damage.
;              No height cues on the reticle. (The round-1 name "off" still works.)
;   am2      = Army Men II rules: a shot flies from the shooter toward the height of what it was aimed at and
;              hits any unit it crosses; the ground stops it where it is that high (cliffs, ridges between);
;              no stance damage change, no cover rule; bullets from behind do double damage. Reticle: UP / DOWN
;              levels and CLIFF / RIDGE.
;   original = the game's own height rules (rounds fly over lower units, the ground stops them, fences by
;              height); the reticle shows what those rules will do (cliff, ridge, too high, MG aims low).
;   modded   = (only here, not in the menus) the mod's earlier rules: shots hit units below / above, the ground
;              still stops them, vehicles on hills fixed.
height_rules=modern
; Sarge slowly heals after a while without being hit; every hit restarts the wait, so a swarm of
; enemies can still kill him. Also in the Gameplay menu.
health_regen=1
; milliseconds without damage before healing starts
regen_delay_ms=6000
; seconds to heal from empty to full once healing runs
regen_full_s=90
; Sarge may climb into (Enter Vehicle key, or click it) and drive an EMPTY enemy vehicle: standing still, no
; passengers. While he drives it, it counts as his: enemies target it, no soldier may board it. When he gets
; out it goes back to its army but stays parked. One-player games only. Mod Settings: COMBAT.
drive_enemy_vehicles=1
; When the vehicle Sarge drives (his own or a captured one) is destroyed, he is thrown out next to the wreck
; alive, a little hurt, instead of dying with it. Mod Settings: COMBAT.
vehicle_bailout=1
; Wooden fences do not stop Sarge: a click route (walk to a spot or to a vehicle) and the mission path may go
; through a wooden fence piece when the way round is much longer, and he breaks it when he reaches it; pushing
; against one (W A S D, hold right) for a moment breaks it too. Never stone walls, sandbags, gates or buildings.
; Mod Settings: F10 panel "Sarge breaks fences".
break_fences=1
; Squad soldiers who FOLLOW Sarge sprint (at [controls] run_speed, like him) while he sprints, and also while
; one is more than about 120 px behind him, so the squad keeps up (far behind while he sprints: a little faster
; than him, to close up). Never through walls or fences. Enemy and
; allied soldiers, and squads given other orders, walk as before. F10 panel "Squad sprints with Sarge".
squad_sprint=1

[modern]
; Enemy awareness (one switch, F10 panel "Enemy awareness", Mod Settings COMBAT): an enemy soldier must NOTICE
; Sarge before he opens fire - a yellow bar fills over him while he can see Sarge (about 0.8 s, longer when Sarge
; kneels / lies prone and the farther away he is; at once when Sarge fires or hits his unit); then a red "!" and a
; red wedge while he targets Sarge, a yellow "?" when he loses him. A dim yellow eye = could see Sarge but has not
; noticed him; prone / kneeling behind cover lower than the enemy hides Sarge. Meter right of SARGE HEALTH: red =
; enemies targeting him, yellow halves = enemies that could see him. 0 = the original game.
; (The older key enemy_alerts is still read when this one is missing.)
enemy_awareness=1

[audio]
; Army Men II sound effects: 1 = the effects mapped in <game folder>\am2_sounds\map.txt (rifle, bazooka, mortar,
; flamethrower, heavy MG, tank cannon, grenade pin, explosions, bullet hits on Sarge / troopers, vehicle engines and
; collisions, the air strike plane, the menu click) come from Army Men II; everything else (voices, radio, music,
; footsteps, ambience, death cries) stays the original. A missing file = the original sound. 0 = the original game.
; Switching (F10 panel "Army Men II sounds", Mod Settings AUDIO/UI "AM II sounds") applies to the next sound played;
; a vehicle engine already running keeps its sound until the next vehicle / mission (restart the mission to be sure).
; The pack (folder am2_sounds) is built by scripts/am2_sounds.py; edit map.txt to change which sounds are used.
am2_sounds=0
; Army Men II background music: 1 = the title, Boot Camp and campaign music come from Army Men II tracks in
; <game folder>\am2_music (which track for which stream / mission: am2_music\map.txt; e.g. Boot Camp = bootcamp,
; Desert = areax / airborne / frontyard, Alpine = homeland / hobby / tankstore, Bayou = kitchen / playset / mania).
; The win / lose jingles stay the original. A missing file = the original music. 0 = the original game.
; Switching (F10 panel "Army Men II music", Mod Settings AUDIO/UI "AM II music") applies when the next track starts
; (next menu screen / mission); the track playing now keeps going. Pack built by scripts/am2_music.py.
am2_music=0
[bindings]
; Modern controls: the key / extra mouse button of every action (also on the F10 panel: Shift + F10, tab BINDS -
; click a cell or Enter, press the new key; Delete clears; Space switches tap / hold / double; "RESET TO DEFAULTS").
; <action>=<key>[:tap|:hold|:double] and <action>_mouse=Middle|Mouse4|Mouse5[:...]; none = unbound; a missing
; entry = the default below. hold = held 300 ms (drop 400 ms), double = pressed twice within 250 ms.
; Fixed (not here): left = walk / use / shoot what is under the pointer, right = force fire, both = cancel,
; wheel = weapons, double-click ground / a vehicle = sprint there (and climb in); on Sarge: click = one stance down (lying: stand up),
; double-click = prone, press + drag up / down = pick a stance, the radial opened on him = the stance ring.
; A new binding that another action has with the same gesture SWAPS (that action gets the old one).
; Defaults:
;   up=W left=A down=S right=D sprint=Shift (+ left click = force fire) slow=Ctrl
;   stance_down=C prone=C:hold stand=C:double dive=Space dive_mouse=Mouse4 roll=Z
;   weapon1..weapon6=1..6 next_weapon_mouse=Middle prev_weapon_mouse=Mouse5 quick_swap=Q drop=X:hold special=G
;   vehicle=F map=M objective=J radial=B radial_mouse=Middle (held) ping=T stats=I peek=E restart=F12
; (The old [keys] entries of roll / peek / stats / radial / ping / restart are taken over as defaults.)

[debug]
; stutter hunting (0 = off): log where the game thread is while a gameplay frame takes longer than this many
; ms ("stall:" lines; exe 0x... = game code, mod+0x... = this DLL). Frames over spike_ms (default 40) are
; always logged with their stage times ("spike:" lines).
stall_sample_ms=0
; 1 = write armymen-mod.log next to ddraw.dll
; 2 = also log mouse movement, 3 = also log which game code draws onto the screen,
; 4 = also wide pictures drawn into the game picture, 5 = also everything drawn in the HUD area
log=1
; testing aids (the game's own cheats, single player): Ctrl+T = teleport Sarge to the pointer
; ("Telekinetic"), Ctrl+I = invulnerable on/off ("Invulnerable"), Ctrl+B = Sarge next to the
; nearest of your vehicles, Ctrl+G = current weapon becomes grenade / mortar (mod test keys). 0 = off
cheat_keys=0
